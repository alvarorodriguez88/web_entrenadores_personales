services:
  db:
    image: mysql:8.0
    container_name: web_entrenadores_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web_entrenadores
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/model/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend:
    build: ./backend
    container_name: web_entrenadores_backend
    restart: unless-stopped
    ports:
      - "8080:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: web_entrenadores_frontend
    restart: unless-stopped
    ports: 
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

  mcp:
    build: ./mcp
    container_name: web_entrenadores_mcp
    restart: unless-stopped
    ports:
      - "5001:8000"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - backend
    

volumes:
  db_data:
  media_data: