services:
  db:
    image: mysql:8.0
    container_name: web_entrenadores_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: web_entrenadores
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/migrations/v1.0.0_initial.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: